name: Gerar APK Android
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          mkdir -p www
          cp -f index.html app.js style.css missia-upgrade.js missia-upgrade.css manifest.json icon-512.png www/ 2>/dev/null || true
          npm install
          npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: misscode-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
